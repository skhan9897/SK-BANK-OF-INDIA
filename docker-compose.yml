version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: skbank_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root_password_2025}
      MYSQL_DATABASE: sk_bank_of_india
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./src/main/resources/db/seed_data.sql:/docker-entrypoint-initdb.d/2_seed_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: skbank_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: sk_bank_of_india
      DB_USER: root
      DB_PASS: ${DB_PASS:-root_password_2025}
      JWT_SECRET: ${JWT_SECRET:-SKBankOfIndiaSecretKeyForJWTAuth2025ProductionKeyRequire256BitsMin!}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
